name: Tutorial benchmark contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "tests/benchmark_tutorial_dependencies.py"
      - "tests/profile_tutorial_dependencies.py"
      - "tests/test_tutorial_benchmark.py"
      - "tests/TUTORIAL_BENCHMARK.md"
      - ".github/workflows/tutorial-benchmark-contracts.yml"
  workflow_dispatch:
    inputs:
      run_public_tutorial:
        description: "Verify and benchmark full public tutorial (161 TCFs, 174 runs)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  fixture-contracts:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PyTUFLOW and pytest
        run: python -m pip install -e . pytest
      - name: Compile public benchmark
        run: python -m compileall -q tests/benchmark_tutorial_dependencies.py tests/profile_tutorial_dependencies.py tests/test_tutorial_benchmark.py
      - name: Run archive and differential correctness contracts
        run: python -m pytest -q tests/test_tutorial_benchmark.py


  public-tutorial-replay:
    name: Full verified public tutorial (Windows Python 3.14)
    # Opt-in only: apply 'run-public-tutorial' PR label to trigger.
    # workflow_dispatch appears once this workflow exists on default.
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-public-tutorial')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_public_tutorial)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned public TUFLOW fixture
        uses: actions/checkout@v5
        with:
          repository: Chain-Frost/ryan-tools-test-data
          ref: d2dae3ecf9a7ed306e1340de54a8d12ca9f53f58
          path: public-tutorial
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install PyTUFLOW
        run: python -m pip install -e . psutil
      - name: Verify archive and run full differential benchmark
        shell: pwsh
        run: |
          $Bundle = Join-Path $env:GITHUB_WORKSPACE 'public-tutorial\tuflow\example_input_preflight'
          $Report = Join-Path $env:RUNNER_TEMP 'pytuflow-public-tutorial.json'
          python tests/benchmark_tutorial_dependencies.py --bundle $Bundle --trials 3 --output $Report
      - name: Attach public syntactic-parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-tutorial-benchmark-py314
          path: ${{ runner.temp }}/pytuflow-public-tutorial.json
          if-no-files-found: warn
          retention-days: 7
