name: Deferred file references

on:
  pull_request:
    paths:
      - "pytuflow/_tmf/**"
      - "pytuflow/__init__.py"
      - "tests/test_deferred_file_references.py"
      - ".github/workflows/deferred-file-references.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferred-context:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Compile PyTUFLOW modules
        run: python -m compileall -q pytuflow/_tmf
      - name: Run deferred-reference contract tests
        run: python -m pytest -q tests/test_deferred_file_references.py
      - name: Run existing TCF context regression tests
        run: python -m pytest -q tests/tmf/test_cf_context.py tests/tmf/test_context.py
