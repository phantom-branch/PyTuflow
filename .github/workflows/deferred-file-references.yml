name: Deferred file references

on:
  pull_request:
    paths:
      - "pytuflow/_tmf/**"
      - "pytuflow/__init__.py"
      - "tests/test_deferred_file_references.py"
      - "tests/test_deferred_database_parity.py"
      - "tests/test_batch_dependencies.py"
      - "tests/test_batch_ordered_inputs.py"
      - "tests/test_compiled_dependency_plan.py"
      - "tests/test_batch_activation_index.py"
      - "tests/test_compiled_control_tree.py"
      - "tests/test_group_constructor_guards.py"
      - "tests/benchmark_batch_dependencies.py"
      - "tests/profile_batch_dependencies.py"
      - ".github/workflows/deferred-file-references.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferred-context:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Compile PyTUFLOW modules
        run: python -m compileall -q pytuflow/_tmf
      - name: Run deferred-reference contract tests
        run: python -m pytest -q tests/test_deferred_file_references.py tests/test_deferred_database_parity.py tests/test_batch_dependencies.py tests/test_batch_ordered_inputs.py tests/test_batch_activation_index.py tests/test_compiled_dependency_plan.py tests/test_compiled_control_tree.py tests/test_group_constructor_guards.py
      - name: Run existing TCF context regression tests
        run: python -m pytest -q tests/tmf/test_cf_context.py tests/tmf/test_context.py tests/tmf/test_xs_db_from_cf.py
      - name: Benchmark 500 distinct batch contexts (Windows Python 3.14)
        if: matrix.python-version == '3.14'
        run: python tests/benchmark_batch_dependencies.py --runs 500 --trials 3
      - name: Benchmark shared static source commands (Windows Python 3.14)
        if: matrix.python-version == '3.14'
        run: python tests/benchmark_batch_dependencies.py --runs 120 --trials 3 --static-inputs 20
      - name: Benchmark transitive variable-derived READs (Windows Python 3.14)
        if: matrix.python-version == '3.14'
        run: python tests/benchmark_batch_dependencies.py --runs 120 --trials 3 --variable-inputs 8
      - name: Profile command-resolution hotspots (Windows Python 3.14)
        if: matrix.python-version == '3.14'
        run: python tests/profile_batch_dependencies.py --runs 120 --static-inputs 20
