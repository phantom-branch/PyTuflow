name: Construction attribution

on:
  pull_request:
    paths:
      - "tests/construction_attribution.py"
      - "tests/profile_construction_attribution.py"
      - "tests/test_construction_attribution.py"
      - "tests/test_profile_construction_attribution.py"
      - "tests/test_construction_attribution_integration.py"
      - "tests/test_construction_attribution_failures.py"
      - ".github/workflows/construction-attribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and focused tests
        run: python -m pip install -e . pytest
      - name: Validate accounting and real parser parity
        run: python -m pytest -q tests/test_construction_attribution.py tests/test_profile_construction_attribution.py tests/test_construction_attribution_failures.py tests/test_construction_attribution_integration.py
      - name: Preserve existing batch contracts
        run: python -m pytest -q tests/test_batch_dependencies.py tests/test_batch_ordered_inputs.py tests/test_compiled_control_tree.py
      - name: Check bounded CLI help
        run: python -m tests.profile_construction_attribution --help
      - name: Compile diagnostics
        run: python -m compileall -q tests/construction_attribution.py tests/profile_construction_attribution.py
