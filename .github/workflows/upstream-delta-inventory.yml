name: Upstream delta inventory checks (not final acceptance)

on:
  pull_request:
    paths:
      - ".github/workflows/upstream-delta-inventory.yml"
      - "ci/upstream_delta.py"
      - "tests/ci/test_upstream_delta.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-tool:
    name: Windows Python ${{ matrix.python }} delta inventory
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify read-only scope inventory
        run: python -m pytest -q tests/ci/test_upstream_delta.py --junitxml=upstream-delta-tests.xml
      - name: Save actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-delta-tests-${{ matrix.python }}
          path: upstream-delta-tests.xml
          retention-days: 30
          if-no-files-found: warn
