name: QGIS face centroid maths (W9)

on:
  pull_request:
    paths:
      - "pytuflow/_outputs/pymesh/mesh_geom/qgismesh_geom.py"
      - "tests/test_qgis_centroid_math.py"
      - ".github/workflows/qgis-face-centroids.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  centroid-maths:
    name: Windows Python ${{ matrix.python-version }} native-face centroid maths
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared dependencies
        run: python -m pip install -c requirements-dev.txt -e . pytest
      - name: Record runtime provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force w9-reports | Out-Null
          git rev-parse HEAD | Tee-Object w9-reports/head.txt
          python -c "import sys, pytuflow; print(sys.version); print(pytuflow.__file__)" | Tee-Object w9-reports/runtime.txt
          python -m pip freeze | Out-File w9-reports/dependencies.txt
      - name: Execute native-face centroid maths
        run: python -m pytest -q tests/test_qgis_centroid_math.py --junitxml=w9-reports/centroids.xml
      - name: Verify complete non-QGIS suite
        if: always()
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree
          root = ElementTree.parse(Path("w9-reports/centroids.xml")).getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) >= 7, f"Incomplete centroid tests: {len(cases)}"
          for category in ("failure", "error", "skipped"):
              assert not list(root.iter(category)), f"Unexpected {category}"
          print(f"Native-face analytical centroid cases: {len(cases)} passed")
      - name: Archive standalone evidence (not QGIS provider parity)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-centroid-math-python-${{ matrix.python-version }}
          path: w9-reports/
          if-no-files-found: error
          retention-days: 14
