name: Original library regression and wheel

on:
  pull_request:
    paths:
      - "pytuflow/**"
      - "tests/**"
      - "ci/**"
      - "pyproject.toml"
      - "hatch_build.py"
      - "MANIFEST.in"
      - ".github/workflows/original-library-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_SHA: cf908cc922ca8448ed6002834877b0b377329eae
  FORK_BASELINE_SHA: e162c04330d24c37bee3ade94479cc4602651060

jobs:
  regression:
    name: Windows ${{ matrix.python }} ${{ matrix.dependencies }} regression
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.12", dependencies: baseline}
          - {python: "3.14", dependencies: baseline}
          - {python: "3.14", dependencies: current}
    defaults:
      run:
        shell: pwsh
        working-directory: candidate
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: candidate
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: candidate/ci/requirements-regression.txt
      - name: Install documented baseline dependencies
        if: matrix.dependencies == 'baseline'
        run: |
          python -m pip install -r ci/requirements-regression.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install current dependencies allowed by package metadata
        if: matrix.dependencies == 'current'
        run: |
          python -m pip install build hatchling pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record dependency and source provenance
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/original-regression" -Force | Out-Null
          python -m pip freeze --all | Out-File -Encoding utf8 "$env:RUNNER_TEMP/original-regression/dependencies.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate regression infrastructure
        run: |
          python -m pytest -q tests/ci --junitxml="$env:RUNNER_TEMP/original-regression/infrastructure.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Derive immutable regression baseline cache key
        id: baseline-key
        if: matrix.dependencies == 'baseline'
        run: |
          $key = python ci/baseline_cache.py key --upstream "$env:UPSTREAM_SHA" --fork "$env:FORK_BASELINE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "value=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore strictly keyed baseline evidence
        id: baseline-cache
        if: matrix.dependencies == 'baseline'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/original-regression/upstream
            ${{ runner.temp }}/original-regression/baseline
          key: pytuflow-w5-baseline-v1-${{ steps.baseline-key.outputs.value }}
      - name: Validate cached reports before any baseline reuse
        id: baseline-verification
        if: matrix.dependencies == 'baseline'
        run: |
          python ci/baseline_cache.py verify --root "$env:RUNNER_TEMP/original-regression" --upstream "$env:UPSTREAM_SHA" --fork "$env:FORK_BASELINE_SHA"
          if ($LASTEXITCODE -eq 0) {
            "valid=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Reusing validated immutable baseline evidence."
          } else {
            "valid=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No matching complete baseline evidence: rerunning both baselines."
            foreach ($name in @("upstream", "baseline")) {
              $path = "$env:RUNNER_TEMP/original-regression/$name"
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            }
          }
          # Python's nonzero result means cache miss, not a GitHub job failure.
          exit 0
      - name: Checkout pinned canonical upstream
        uses: actions/checkout@v5
        with:
          repository: TUFLOW-Support/PyTuflow
          ref: ${{ env.UPSTREAM_SHA }}
          path: pristine-upstream
          persist-credentials: false
      - name: Run canonical upstream (raw failures retained)
        if: matrix.dependencies != 'baseline' || steps.baseline-verification.outputs.valid != 'true'
        continue-on-error: true
        run: |
          python ci/run_regression.py --source ../pristine-upstream --ref "$env:UPSTREAM_SHA" --label upstream --report-dir "$env:RUNNER_TEMP/original-regression/upstream"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run recorded fork baseline (raw failures retained)
        if: matrix.dependencies != 'baseline' || steps.baseline-verification.outputs.valid != 'true'
        continue-on-error: true
        run: |
          python ci/run_regression.py --source . --ref "$env:FORK_BASELINE_SHA" --label fork-baseline --report-dir "$env:RUNNER_TEMP/original-regression/baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify fresh baseline reports before caching
        id: fresh-baseline
        if: matrix.dependencies == 'baseline' && steps.baseline-verification.outputs.valid != 'true'
        run: |
          python ci/baseline_cache.py verify --root "$env:RUNNER_TEMP/original-regression" --upstream "$env:UPSTREAM_SHA" --fork "$env:FORK_BASELINE_SHA"
          if ($LASTEXITCODE -eq 0) {
            "valid=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "valid=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Incomplete baseline evidence; do not write to cache. Comparison gate will still fail closed."
          }
          # The later strict comparison is authoritative. Do not leave a
          # stale LASTEXITCODE in a PowerShell step that records cache validity.
          exit 0
      # PR-created caches are merge-ref scoped and cannot be shared with
      # another PR. Default-branch seeding is handled by the separate trusted
      # push/workflow_dispatch workflow; PR jobs are restore-only.
      - name: Run exact PR head (raw failures retained)
        continue-on-error: true
        run: |
          python ci/run_regression.py --source . --ref HEAD --label candidate --report-dir "$env:RUNNER_TEMP/original-regression/candidate"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record upstream to fork differences
        if: always()
        continue-on-error: true
        run: |
          python ci/compare_regression.py --baseline "$env:RUNNER_TEMP/original-regression/upstream/report.json" --candidate "$env:RUNNER_TEMP/original-regression/baseline/report.json" --output "$env:RUNNER_TEMP/original-regression/upstream-comparison.json" --required-group time_series --required-group python_mesh --required-group tmf --required-group project --required-group fm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require complete canonical-upstream evidence independently of historical differences
        if: always()
        run: |
          python ci/compare_regression.py --baseline "$env:RUNNER_TEMP/original-regression/upstream/report.json" --candidate "$env:RUNNER_TEMP/original-regression/upstream/report.json" --output "$env:RUNNER_TEMP/original-regression/upstream-completeness.json" --required-group time_series --required-group python_mesh --required-group tmf --required-group project --required-group fm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gate complete candidate evidence against recorded fork baseline
        if: always()
        run: |
          python ci/compare_regression.py --baseline "$env:RUNNER_TEMP/original-regression/baseline/report.json" --candidate "$env:RUNNER_TEMP/original-regression/candidate/report.json" --output "$env:RUNNER_TEMP/original-regression/candidate-comparison.json" --required-group time_series --required-group python_mesh --required-group tmf --required-group project --required-group fm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write concise evidence summary
        if: always()
        run: |
          foreach ($label in @("upstream", "baseline", "candidate")) {
            $path = "$env:RUNNER_TEMP/original-regression/$label/report.json"
            if (Test-Path -LiteralPath $path) {
              $report = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
              "### $label — $($report.source.sha)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
              "Raw status: $($report.raw_status); actual outcomes: $($report.counts | ConvertTo-Json -Compress)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            } else {
              "$label — INCOMPLETE: report missing" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
            }
          }
          $comparison = "$env:RUNNER_TEMP/original-regression/candidate-comparison.json"
          if (Test-Path -LiteralPath $comparison) {
            $result = Get-Content -Raw -LiteralPath $comparison | ConvertFrom-Json
            "Candidate comparison: $($result.status); inherited failures: $($result.inherited_failures.Count); regressions/incomplete evidence: $($result.problems.Count)" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
      - name: Archive all raw results and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-regression-${{ matrix.python }}-${{ matrix.dependencies }}
          path: ${{ runner.temp }}/original-regression/
          if-no-files-found: error
          retention-days: 30

  wheel:
    name: Windows ${{ matrix.python }} installed wheel
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/requirements-regression.txt
      - name: Install declared test and build dependencies
        run: |
          python -m pip install -r ci/requirements-regression.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build sdist then build wheel from sdist without a virtual environment
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/original-wheel" -Force | Out-Null
          $sourceRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonVersion = python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source_sha=$sourceRevision; python=$pythonVersion; build_command="python -m build --no-isolation" } | ConvertTo-Json | Out-File -Encoding utf8 "$env:RUNNER_TEMP/original-wheel/provenance.json"
          python -m build --no-isolation --outdir "$env:RUNNER_TEMP/original-wheel/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install built wheel into the configured job interpreter
        run: |
          $wheels = @(Get-ChildItem "$env:RUNNER_TEMP/original-wheel/dist/*.whl")
          if ($wheels.Count -ne 1) { throw "Expected exactly one newly built wheel" }
          python -m pip install --no-deps --force-reinstall $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed origin, public API, resources and CLI outside checkout
        run: |
          $sourceRoot = (Get-Location).Path
          $wheel = @(Get-ChildItem "$env:RUNNER_TEMP/original-wheel/dist/*.whl")[0].FullName
          $outside = "$env:RUNNER_TEMP/original-wheel/outside"
          New-Item -ItemType Directory -Path $outside -Force | Out-Null
          Set-Location $outside
          python -I "$sourceRoot/ci/wheel_smoke.py" --source-root $sourceRoot --wheel $wheel --report "$env:RUNNER_TEMP/original-wheel/wheel-smoke.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive built distributions and complete smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-wheel-${{ matrix.python }}
          path: ${{ runner.temp }}/original-wheel/
          if-no-files-found: error
          retention-days: 30
