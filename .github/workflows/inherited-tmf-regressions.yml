name: Inherited TMF regressions

on:
  pull_request:
    paths:
      - 'pytuflow/_tmf/db/bc_dbase_run_state.py'
      - 'tests/tmf/test_control_file.py'
      - 'tests/tmf/test_input.py'
      - 'tests/tmf/test_input_context.py'
      - 'tests/tmf/test_inherited_regression_contracts.py'
      - '.github/workflows/inherited-tmf-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    name: Windows Python ${{ matrix.python-version }} inherited TMF
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyTUFLOW with current dependencies and pytest
        run: |
          python -m pip install -e . pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed source and dependency versions
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          git rev-parse HEAD | Set-Content reports/head.txt
          python -c "import pathlib, pytuflow, sys; print(sys.version); print(pytuflow.__file__); assert pathlib.Path(pytuflow.__file__).parent.samefile(pathlib.Path.cwd() / 'pytuflow')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Set-Content reports/dependencies.txt
      - name: Run all previously failing tests and existing deferred contracts
        run: |
          python -m pytest -q tests/tmf/test_control_file.py tests/tmf/test_scope_writer.py tests/tmf/test_altered_inputs.py tests/tmf/test_inputs.py tests/tmf/test_input.py tests/tmf/test_input_context.py tests/tmf/test_cf_context.py tests/tmf/test_context.py tests/tmf/test_fv_cf.py tests/tmf/test_scope.py tests/tmf/test_events.py tests/tmf/test_xs_db_from_cf.py tests/test_deferred_file_references.py tests/test_deferred_database_parity.py tests/test_batch_dependencies.py tests/tmf/test_inherited_regression_contracts.py --junitxml=reports/tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain exact-head reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inherited-tmf-${{ matrix.python-version }}
          path: reports
          if-no-files-found: warn
          retention-days: 14
