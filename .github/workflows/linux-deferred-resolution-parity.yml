name: Linux deferred-resolution parity

on:
  pull_request:
    paths:
      - ".github/workflows/linux-deferred-resolution-parity.yml"
      - "pytuflow/_tmf/**"
      - "tests/test_linux_deferred_parity.py"
      - "docs/work/linux-deferred-resolution-followup.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deferred-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PyTUFLOW candidate
        uses: actions/checkout@v5
        with:
          path: upstream
      - name: Checkout Linux-aware consumer dependency
        uses: actions/checkout@v5
        with:
          repository: Chain-Frost/ryan-tools
          ref: 993eb083dec15b1155d7ae61a28d65003357ff77
          path: ryan-tools
      - name: Initialise immutable public TUFLOW example archive
        working-directory: ryan-tools
        run: git submodule update --init tests/test_data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: upstream/pyproject.toml
      - name: Install parser and isolated consumer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./upstream
          python -m pip install -e ./ryan-tools --no-deps
          python -m pip install pytest pyshp loguru colorama psutil
      - name: Record revisions and verify archive
        working-directory: ryan-tools
        run: |
          git -C ../upstream rev-parse HEAD
          git rev-parse HEAD
          python -m tests.fixtures.tuflow_example_repro.run_checks --verify-only
      - name: Linux path and database source regressions
        working-directory: upstream
        run: |
          python -m pytest -q tests/test_linux_deferred_parity.py \
            tests/test_deferred_file_references.py \
            tests/test_deferred_database_parity.py \
            tests/tmf/test_tuflow_path.py
      - name: Complete public Linux 161-TCF / 174-run comparison
        working-directory: ryan-tools
        run: |
          mkdir -p ../reports/linux
          python -m tests.fixtures.tuflow_example_repro.run_checks \
            --pytuflow-checkout ../upstream --batch --output ../reports/linux
          python -c 'import json; from pathlib import Path; rows=json.loads(Path("../reports/linux/results.json").read_text(encoding="utf-8")); assert len(rows)==161 and sum(row["runs"] for row in rows)==174; assert all(row["accepted_parity"] and row["missing"]==0 and row["extra"]==0 and row["batch_missing"]==0 and row["batch_extra"]==0 for row in rows), "Incomplete Linux eager/deferred/batch parity"'
      - name: Publish Linux result counts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("reports/linux/results.json")
          if not report.exists():
              summary = "Linux full-run output was not generated; inspect earlier job steps.\n"
          else:
              rows = json.loads(report.read_text(encoding="utf-8"))
              total = sum(row["runs"] for row in rows)
              accepted = sum(row["runs"] for row in rows if row["accepted_parity"])
              summary = (
                  f"Linux public archive: {len(rows)}/161 TCFs inspected; "
                  f"{accepted}/{total} run combinations accepted; "
                  f"missing identities {sum(row.get('missing', 0) for row in rows)}; "
                  f"extra identities {sum(row.get('extra', 0) for row in rows)}; "
                  f"failed cases {sum(not row['accepted_parity'] for row in rows)}.\n"
              )
          print(summary)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as target:
              target.write(summary)
          PY
      - name: Upload reproducible public Linux diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deferred-parity
          path: reports/linux
          if-no-files-found: warn
          retention-days: 14
