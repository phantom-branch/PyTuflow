name: Profile evidence retention

on:
  pull_request:
    paths:
      - "tests/profile_capture.py"
      - "tests/profile_batch_dependencies.py"
      - "tests/test_profile_capture.py"
      - ".github/workflows/profile-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-evidence:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Check evidence retention and failure boundaries
        run: python -m pytest -q tests/test_profile_capture.py
      - name: Check CLI without GIS imports
        run: python tests/profile_batch_dependencies.py --help
      - name: Compile changed diagnostics
        run: python -m py_compile tests/profile_capture.py tests/profile_batch_dependencies.py tests/test_profile_capture.py
